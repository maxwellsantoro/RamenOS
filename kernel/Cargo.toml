[package]
name = "kernel"
version = "0.0.0"
edition = "2021"

[lib]
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
kernel_api = { path = "../kernel_api" }
spin = "0.9"

[features]
default = []
# Enable Oracle net/block providers and development init probes.
# IPC capability checks remain enforced in this feature configuration.
# This should ONLY be enabled for development/testing, never in production builds
test_protocols = []
