name: ci

on:
  push:
  pull_request:

# PR supersession never cancels a push run, and never changes required checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      os_code: ${{ steps.cls.outputs.os_code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: cls
        name: Detect OS-code changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE"
          elif [ "$PUSH_BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=$(git hash-object -t tree --stdin </dev/null)
          else
            BASE="$PUSH_BASE"
          fi
          OS=$(python3 tools/ci/change_policy.py classify "$BASE" HEAD)
          echo "os_code=$OS" >> "$GITHUB_OUTPUT"

  quality:
    needs: changes
    if: needs.changes.outputs.os_code == 'true'
    runs-on: ubuntu-latest
    env:
      RAMEN_CI_STRICT: "1"
      RUST_TEST_THREADS: "1"
      LINT_ALLOW_WARNINGS: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Install system prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y just qemu-system-x86 qemu-system-arm ovmf python3 python3-jsonschema gcc cpio gzip e2fsprogs curl ripgrep
      - id: toolchain
        name: Read pinned manifest toolchain
        run: echo "channel=$(python3 tools/ci/ci_lanes.py toolchain)" >> "$GITHUB_OUTPUT"
      - name: Cache Cargo downloads and pinned toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup/toolchains
          key: ${{ runner.os }}-${{ runner.arch }}-rust-downloads-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rust-downloads-${{ hashFiles('rust-toolchain.toml') }}-
      - name: Install manifest-pinned Rust components and targets
        run: python3 tools/ci/ci_lanes.py install-toolchain
      - name: Run canonical quality lane (serialized)
        run: python3 tools/ci/ci_lanes.py lane quality
      - name: Retain actual quality stage timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundry-quality-timings-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/foundry/timings/
          if-no-files-found: error

  host-docker:
    needs: changes
    if: needs.changes.outputs.os_code == 'true'
    runs-on: ubuntu-latest
    env:
      RAMEN_CI_STRICT: "1"
      RUST_TEST_THREADS: "1"
      LINT_ALLOW_WARNINGS: "0"
      SKIP_E2E_ASSERTIONS: "1"
      RAMEN_FOUNDRY_BUILD_CACHE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install system prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y just qemu-system-x86 qemu-system-arm ovmf python3 python3-jsonschema gcc cpio gzip e2fsprogs curl ripgrep
      - id: toolchain
        name: Read pinned manifest toolchain
        run: echo "channel=$(python3 tools/ci/ci_lanes.py toolchain)" >> "$GITHUB_OUTPUT"
      - name: Cache Cargo downloads and pinned toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup/toolchains
          key: ${{ runner.os }}-${{ runner.arch }}-rust-downloads-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rust-downloads-${{ hashFiles('rust-toolchain.toml') }}-
      # Canonical host setup pulls/checks the image BEFORE its pinned Rust install.
      # Compilation only: helper independently admits exact inner keys and locks.
      # Fresh out/desktop evidence is never restored or accepted from a cache.
      - name: Cache isolated compiler targets
        uses: actions/cache@v4
        with:
          path: out/ci-optimization/compiler-cache
          key: ${{ runner.os }}-${{ runner.arch }}-foundry-compile-v1-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '**/*.rs', '**/Cargo.toml', 'idl/**', 'tools/**', 'docs/**', 'justfile', '.cargo/**', '.github/**', 'services/**/fixtures/**') }}
      - name: Run canonical host lane (serialized)
        run: python3 tools/ci/ci_lanes.py lane host
      - name: Retain actual host stage timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundry-host-timings-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/foundry/timings/
          if-no-files-found: error

  agent-task:
    needs: changes
    if: needs.changes.outputs.os_code == 'true'
    runs-on: ubuntu-latest
    env:
      RAMEN_CI_STRICT: "1"
      RUST_TEST_THREADS: "1"
      LINT_ALLOW_WARNINGS: "0"
      SKIP_E2E_ASSERTIONS: "1"
      RAMEN_FOUNDRY_BUILD_CACHE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install system prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y just qemu-system-x86 qemu-system-arm ovmf python3 python3-jsonschema gcc cpio gzip e2fsprogs curl ripgrep
      - id: toolchain
        name: Read pinned manifest toolchain
        run: echo "channel=$(python3 tools/ci/ci_lanes.py toolchain)" >> "$GITHUB_OUTPUT"
      - name: Cache Cargo downloads and pinned toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup/toolchains
          key: ${{ runner.os }}-${{ runner.arch }}-rust-downloads-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rust-downloads-${{ hashFiles('rust-toolchain.toml') }}-
      # This runner owns fresh outputs; only downloads/toolchain are cached.
      - name: Run canonical agent lane (serialized)
        run: python3 tools/ci/ci_lanes.py lane agent
      - name: Retain actual agent stage timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundry-agent-timings-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/foundry/timings/
          if-no-files-found: error

  qemu:
    needs: changes
    if: needs.changes.outputs.os_code == 'true'
    runs-on: ubuntu-latest
    env:
      RAMEN_CI_STRICT: "1"
      RUST_TEST_THREADS: "1"
      LINT_ALLOW_WARNINGS: "0"
      SKIP_E2E_ASSERTIONS: "1"
      S2_COMPAT_KERNEL_URL: https://github.com/${{ github.repository }}/releases/download/compat-kernel-v6.6.50/compat-kernel.deb
      S2_COMPAT_KERNEL_SHA256: cd62738b1a85029517d7aa64018454e78c0492391ea7b0334d1b254587c358cc
    steps:
      - uses: actions/checkout@v4
      - name: Install system prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y just qemu-system-x86 qemu-system-arm ovmf python3 python3-jsonschema gcc cpio gzip e2fsprogs curl ripgrep
      - id: toolchain
        name: Read pinned manifest toolchain
        run: echo "channel=$(python3 tools/ci/ci_lanes.py toolchain)" >> "$GITHUB_OUTPUT"
      - name: Cache Cargo downloads and pinned toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup/toolchains
          key: ${{ runner.os }}-${{ runner.arch }}-rust-downloads-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rust-downloads-${{ hashFiles('rust-toolchain.toml') }}-
      - name: Install manifest-pinned Rust components and targets
        run: python3 tools/ci/ci_lanes.py install-toolchain
      - name: Prepare pinned S2 download cache
        run: mkdir -p out/compat_s2/kernel
      - name: Cache verified S2 package only
        uses: actions/cache@v4
        with:
          path: out/compat_s2/kernel/kernel.deb
          key: ${{ runner.os }}-s2-compat-kernel-${{ env.S2_COMPAT_KERNEL_SHA256 }}
      - name: Run canonical qemu lane (serialized)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/ci/ci_lanes.py lane qemu
      - name: Retain actual qemu stage timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundry-qemu-timings-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/foundry/timings/
          if-no-files-found: error

  # This stable required check rejects failed, cancelled or unexpectedly skipped
  # lanes. Only a successful docs-only classification allows four lane skips.
  foundry:
    runs-on: ubuntu-latest
    needs: [changes, quality, host-docker, agent-task, qemu]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Evaluate complete Foundry lane results
        env:
          CHANGES: ${{ needs.changes.result }}
          OS_CODE: ${{ needs.changes.outputs.os_code }}
          QUALITY: ${{ needs.quality.result }}
          HOST: ${{ needs.host-docker.result }}
          AGENT: ${{ needs.agent-task.result }}
          QEMU: ${{ needs.qemu.result }}
        run: python3 tools/ci/change_policy.py foundry "$CHANGES" "$OS_CODE" "$QUALITY" "$HOST" "$AGENT" "$QEMU"

  org-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Foundry org governance gate (G0)
        run: bash tools/ci/foundry_org_governance_g0.sh

  merge-gate:
    runs-on: ubuntu-latest
    needs: [changes, foundry, org-governance]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Evaluate mandatory classification, Foundry and governance results
        env:
          CHANGES: ${{ needs.changes.result }}
          OS_CODE: ${{ needs.changes.outputs.os_code }}
          FOUNDRY: ${{ needs.foundry.result }}
          GOVERNANCE: ${{ needs.org-governance.result }}
        run: python3 tools/ci/change_policy.py merge "$CHANGES" "$OS_CODE" "$FOUNDRY" "$GOVERNANCE"
