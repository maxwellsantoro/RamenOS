# HIL appliance controller contract (S12.4 / S13.9).
# Source of truth for Raspberry Pi-class lab controller requirements.

schema_version = 1
tier = 1
status = "physically_ready_pending_live_capture"
role = "hil_appliance_controller"
gate = "tools/ci/foundry_hil_appliance_s12_4.sh"

[naming]
long = "HIL Appliance Controller"
short = "HIL appliance"
code_prefix = "hil_appliance"
env_prefix = "RAMEN_HIL_APPLIANCE"
slice = "S12.4 / S13.9 HIL Appliance Controller"

[controller]
id = "pi-hil-01"
family = "raspberry-pi"
os = "linux"
network = "ethernet_preferred"
trust_boundary = "lab_infrastructure_not_target_tcb"

[inventory]
controller = "Raspberry Pi 4 Model B"
memory_gib = 4
controller_status = "acquired"
usb_rs232_adapter = "FTDI"
usb_rs232_adapter_status = "acquired"
null_modem_adapters = true
serial_path_status = "physically_wired_pending_live_capture"
physical_setup = "ready"
inventory_source = "operator_report_2026-07-19"

[requirements]
ssh = true
persistent_logs = true
serial_capture = "usb_rs232_default"
power_control = "intel_amt_primary"
reset_control = "intel_amt_primary"
evidence_bundle = true

[serial]
default_device = "/dev/ttyUSB0"
baud = 115200
data_bits = 8
parity = "none"
stop_bits = 1
safe_default = "target_com_or_db9_to_usb_rs232_adapter"
raw_gpio_uart = "ttl_3v3_only"
forbidden = "direct_pi_gpio_to_rs232_db9"

[amt]
version = "11.0"
transport = "wired_ethernet"
provisioning = "pending_validation"
required_actions = ["status", "power_on", "power_off", "reset", "power_cycle"]
network_boundary = "trusted_lab_management_network"
internet_exposure = "forbidden"

[fallback]
front_panel_relay = "deferred_unless_amt_validation_fails"
smart_plug_or_pdu = "deferred_until_after_amt_validation"

[kvm.future]
video_capture = "uvc_hdmi_capture"
hid_injection = "usb_hid_gadget"
virtual_media = "usb_mass_storage_gadget_or_boot_media_mux"

[evidence]
schema = "docs/HIL_APPLIANCE_EVIDENCE_V0.md"
kind = "hil_appliance_run_v0"
run_id_prefix = "hil_appliance"
dir = "out/evidence"
required_fields = [
  "schema_version",
  "evidence_kind",
  "evidence_level",
  "run_id",
  "appliance_id",
  "target_id",
  "git_sha",
  "gate",
  "started_at_unix_ms",
  "ended_at_unix_ms",
  "serial_device",
  "serial_input_kind",
  "serial_log_sha256",
  "controller_log_sha256",
  "power_events",
  "artifact_hashes",
  "serial_markers_observed",
  "target_hil_evidence_markers",
  "gate_evidence",
  "result",
]

[env]
enable = "RAMEN_HIL_APPLIANCE=1"
appliance_id = "RAMEN_HIL_APPLIANCE_ID"
target_id = "RAMEN_HIL_TARGET_ID"
serial_dev = "RAMEN_HIL_SERIAL_DEV"
amt_host = "RAMEN_HIL_AMT_HOST"
amt_user = "RAMEN_HIL_AMT_USER"
evidence_dir = "RAMEN_HIL_EVIDENCE_DIR"

default_ci = "docs_and_manifest_only"
